# Fuentes por escenario. Todas usan la misma configuración de monitoreo (config/monitor.yaml).
# La referencia usa frames 0-399 y los escenarios 400-794, para que la referencia no
# comparta observaciones con C1/C2.

reference:
  description: Referencia de confianza en condiciones representativas (video original, primera mitad).
  evaluate_rules: false        # aún no existe referencia; solo se registran observaciones
  source:
    source_id: video-vtest-01
    type: video_file
    path: data/videos/vtest.avi
    sha256: 45cddc9490be69345cbdab64ca583be65987e864ca408038e648db99e10516cf
    playback: realtime         # se respeta el fps nativo del archivo (10 fps)
    sample_every: 2            # se infiere 1 de cada 2 frames -> 5 fps nominal
    queue_maxsize: 4
    start_frame: 0
    end_frame: 400             # exclusivo

c1-normal:
  description: "C1 · Operación normal: video original, segunda mitad."
  evaluate_rules: true
  source:
    source_id: video-vtest-01
    type: video_file
    path: data/videos/vtest.avi
    sha256: 45cddc9490be69345cbdab64ca583be65987e864ca408038e648db99e10516cf
    playback: realtime
    sample_every: 2
    queue_maxsize: 4
    start_frame: 400
    end_frame: null

c2-baja-confianza:
  description: "C2 · Baja confianza: el mismo tramo con desenfoque óptico (gaussiano sigma=7)."
  evaluate_rules: true
  source:
    source_id: video-vtest-blur7
    type: video_file
    path: data/videos/vtest_blur7.avi   # generado por scripts/prepare_inputs.py
    sha256: d625c3a994235c08b13e2b77e4bcced4c281f6529910576dfc4c67fd68ad1861
    playback: realtime
    sample_every: 2
    queue_maxsize: 4
    start_frame: 400
    end_frame: null

# ---------------------------------------------------------------- escenarios adicionales
# No forman parte de la base. Usan la misma configuración (config_ref) que C1/C2; lo que
# cambia es la fuente (source_ref), que declara la falla inyectada y el watchdog.

s1-interrupcion:
  description: >-
    S1 · Interrupción y recuperación del stream: el tramo de C1 pierde la conexión en el
    frame 500 durante 15 s; la fuente reintenta cada 2 s y retoma en la posición en vivo.
  evaluate_rules: true
  source:
    source_id: video-vtest-01
    type: video_file
    path: data/videos/vtest.avi
    sha256: 45cddc9490be69345cbdab64ca583be65987e864ca408038e648db99e10516cf
    playback: realtime
    sample_every: 2
    queue_maxsize: 4
    start_frame: 400
    end_frame: null
    watchdog:
      gap_after_s: 1.0         # tras 1 s sin frames, cada frame esperado (0.2 s) es un hueco
    fault_injection:
      outage:
        at_frame: 500          # 10 s después del inicio del tramo
        duration_s: 15
        reconnect_every_s: 2

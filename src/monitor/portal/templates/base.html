<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Centro de monitoreo CV{% endblock %}</title>
<style>
:root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --card:#fff;
        --low:#c0392b; --doubt:#d68910; --accepted:#1e8449; --info:#2471a3; --high:#922b21; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
header { background:#1d1d1b; color:#fff; padding:10px 20px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
header a { color:#fff; text-decoration:none; font-weight:500; }
header strong { margin-right:12px; }
main { padding:16px 20px; max-width:1300px; margin:auto; }
h1 { font-size:20px; margin:4px 0 12px; } h2 { font-size:16px; margin:20px 0 8px; }
table { border-collapse:collapse; width:100%; background:var(--card); font-size:13px; }
th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
th { background:#efefea; font-weight:600; }
.wrap { overflow-x:auto; }
a { color:#1a5276; }
.muted { color:var(--muted); } .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
.badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; color:#fff; background:#7f8c8d; }
.z-low,.s-warning { background:var(--low); } .z-doubt { background:var(--doubt); } .z-accepted { background:var(--accepted); }
.s-info { background:var(--info); } .s-high { background:var(--high); }
.st-open { background:#a93226; } .st-resolved { background:#566573; }
.st-no_detections { background:#5d6d7e; } .st-source_gap { background:#6c3483; } .st-error { background:#000; } .st-ok { background:var(--accepted); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-all; }
form.filters { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:10px; }
form.filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); }
select, input, button { font:inherit; padding:4px 6px; }
.thumb { width:100%; border-radius:4px; display:block; }
pre { background:#fff; border:1px solid var(--line); padding:10px; overflow:auto; font-size:12px; }
td a.mono, td.mono { white-space:nowrap; }
.empty { padding:16px; background:#fff; border:1px dashed var(--line); color:var(--muted); }
</style>
</head>
<body>
<header><strong>Centro de monitoreo CV</strong>
  <a href="/">Inicio</a><a href="/eventos">Eventos</a><a href="/alertas">Alertas</a><a href="/tablero">Tablero</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
